[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pypdfbox"
version = "2.0.0"
description = "Python-native port of Apache PDFBox-compatible APIs (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Mehdy Haghy" },
    { name = "pypdfbox contributors" },
]
keywords = [
    "pdf",
    "pdfbox",
    "accessibility",
    "tagged-pdf",
    "pdf-a",
    "pdf-ua",
    "pdf-parser",
    "pdf-writer",
    "pdf-rendering",
    "xmp",
    "fontbox",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

# PRD §4 + §3.7.1: runtime deps require explicit user approval per the
# library catalog. Currently approved:
#   - cryptography (Apache 2.0 / BSD): replaces upstream's javax.crypto
#     stdlib usage + Bouncy Castle for encryption/signing. Required by
#     pypdfbox.pdmodel.encryption (StandardSecurityHandler r2-r6:
#     RC4 40/128-bit, AES-128/256 CBC) and signature verification
#     (PDSignature /Contents PKCS#7).
# Font handling is ported from org.apache.fontbox.* directly — no
# fonttools dep. asn1crypto / pyHanko intentionally NOT adopted; see
# CHANGES.md for rationale.
dependencies = [
    "cryptography>=50",   # Apache-2.0 / BSD — floor raised in 2.0.0: <50 carries 7 known
                          # advisories incl. GHSA-g6cj-pr64-35w5 (PKCS#7 EnvelopedData
                          # Bleichenbacher oracle), which is on the PDSignature verify path
    "Pillow>=12.3.0",     # HPND (MIT-CMU) — 12.2.0 carries 26 advisories; 12.3.0 clears them — KEEP for ICC color transforms via ImageCms (LittleCMS2-backed) + a few stragglers
    "fontTools>=4",       # MIT — TTF/CFF/OTF/Type1 parsing for pypdfbox.fontbox
    # aggdraw removed in wave 1329 — replaced by skia-python (same draw
    # functionality, BSD-3, actively maintained). aggdraw was stale
    # since March 2020 and its PyPI License field ("Python (MIT style)")
    # is a legacy descriptive string rather than an SPDX identifier.
    "skia-python>=144",   # BSD-3-Clause — canvas + path drawing + AA + ICC color spaces; PNG/JPEG/WebP I/O (replaces aggdraw)
    "imagecodecs>=2026",  # BSD-3-Clause — TIFF + CCITT (RLE/T.4/T.6) + JPEG2K + long tail of codecs
    "numpy>=2",           # BSD-3 AND 0BSD AND MIT AND Zlib AND CC0-1.0 (all permissive; bundled-code mix) — pixel math + CMYK conversion
]

# Marker extra for opt-in CJK font auto-download (see pypdfbox/fontbox/cjk_loader.py).
# Empty by default — the loader uses stdlib (urllib + zipfile + hashlib) and only
# fetches the upstream Noto Sans CJK release zips when both:
#   1. The user installed pypdfbox with ``pip install pypdfbox[cjk]``  AND
#   2. The environment variable ``PYPDFBOX_CJK_AUTODOWNLOAD=1`` is set.
# Fonts are pinned to upstream tag Sans2.004 (SIL OFL 1.1) and verified by SHA-256
# before extraction into the per-user cache dir.
[project.optional-dependencies]
cjk = []

[project.urls]
Homepage = "https://github.com/mehdyhaghy/pypdfbox"
Repository = "https://github.com/mehdyhaghy/pypdfbox"
Documentation = "https://github.com/mehdyhaghy/pypdfbox#readme"
"Bug Tracker" = "https://github.com/mehdyhaghy/pypdfbox/issues"
Changelog = "https://github.com/mehdyhaghy/pypdfbox/blob/main/CHANGES.md"

[project.scripts]
pypdfbox = "pypdfbox.tools.cli:main"

# PEP 735 dependency groups — uv-native, replaces optional-dependencies for dev tooling.
[dependency-groups]
dev = [
    "pytest>=8",          # MIT
    "pytest-cov>=5",      # MIT
    "ruff>=0.5",          # MIT
    "mypy>=1.10",         # MIT
]

[tool.hatch.build.targets.wheel]
packages = ["pypdfbox"]
# Apache 2.0 §4: hatchling already ships LICENSE + NOTICE in the wheel's
# .dist-info/licenses/. PROVENANCE.md (the §4b "you changed these files"
# notice for the ported source) isn't auto-detected, so carry it in the
# package so a binary redistribution still includes it.
[tool.hatch.build.targets.wheel.force-include]
"PROVENANCE.md" = "pypdfbox/PROVENANCE.md"

# Lean source distribution: only the library + the legal/user-facing docs.
# The migration apparatus (archive/), the test suite, docs/, and scripts/ are
# deliberately NOT shipped — see archive/README.md. Patterns are root-anchored
# (leading "/") so e.g. "README.md" doesn't also sweep in archive/README.md.
[tool.hatch.build.targets.sdist]
include = [
    "/pypdfbox",
    "/README.md",
    "/CHANGES.md",
    "/LICENSE",
    "/NOTICE",
    "/PROVENANCE.md",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``live_oracle`` (auto-applied in tests/conftest.py) is deselected by
# default: those ~44 modules each launch a JVM against the pinned
# Apache PDFBox jar. Run them deliberately -- before a release or a jar
# swap -- with ``pytest -m live_oracle`` (a -m on the command line
# overrides this one).
addopts = "-ra --strict-markers -m 'not live_oracle'"

[tool.ruff]
line-length = 100
target-version = "py314"
# archive/ is frozen migration apparatus (oracle harness probes + the archived
# differential test suite). It is not subject to the ongoing lint gate; if any
# of it is restored under tests/ it gets re-linted there.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM",
    "N",        # pep8-naming — enforces the project's snake_case / no-camelCase-alias policy
    "RUF100",   # unused `# noqa` directives (stale suppressions rot silently)
    "RET501",   # explicit `return None` in a function that only ever returns None
    "FURB136",  # `a if a < b else b` -> min()/max()
    "FURB188",  # manual prefix/suffix slicing -> str.removeprefix()/removesuffix()
    "TC006",    # quote the type expression in typing.cast()
    "PLR0402",  # `import a.b as b` -> `from a import b`
    "PIE",      # flake8-pie — dead/duplicated constructs
    "C4",       # flake8-comprehensions
]
ignore = [
    # UP012: prefer explicit encoding="utf-8" / "utf-8" on encode/decode/open
    # for readability and defensiveness, even though Python 3 hard-codes UTF-8
    # as the str.encode default. Project preference.
    "UP012",
    # N818: "exception name should end in Error". pypdfbox mirrors upstream
    # Apache PDFBox class names exactly (CLAUDE.md "Compatibility
    # preservation" — non-negotiable), and PDFBox / fontbox / xmpbox follow
    # the Java convention of a trailing `Exception`: InvalidPasswordException,
    # DamagedFontException, MissingImageReaderException, BadFieldValueException,
    # XmpParsingException, JBIG2Exception, ... Renaming them would break both
    # upstream parity and the public API. 16 of the 17 library hits are
    # one-for-one upstream ports (each has a PROVENANCE.md row); the 17th is
    # the private `_HashAbort` sentinel in multipdf/pdf_merger_utility.py,
    # a control-flow signal rather than an error and not public surface.
    # Blanket-ignored rather than scattering 17 identical noqa comments.
    "N818",
]

# pep8-naming carve-outs. Two kinds of name are legitimately not snake_case:
#   1. Third-party API surface that a test double has to mirror exactly.
#      fontTools reads/writes these attributes on the objects we hand it
#      (``TTFont.recalcBBoxes``, ``head.unitsPerEm``, ``cmap.platformID``,
#      CFF ``topDict.rawDict`` / ``nominalWidthX`` ...), and xml.dom nodes
#      expose ``localName`` / ``namespaceURI`` / ``nodeName``. Renaming a
#      stub's attribute would simply stop the double from working, so the
#      camelCase spelling is a contract, not a style choice. The six
#      ``get*``/``is*`` entries are the fontTools glyph-set / glyph / cmap
#      methods our fakes implement for the same reason.
#   2. ``test_*`` functions. pytest collects on the ``test_`` prefix; the
#      remainder of the name routinely embeds a case-sensitive spec token —
#      PDF operators (``Tj`` and ``TJ``, ``S`` and ``s``, ``B_star``, ``Q``)
#      and Unicode bidi classes (``L``, ``EN``, ``AN``, ``RTL``). Lowercasing
#      those would make the test name ambiguous or wrong. The pattern still
#      leaves Java-shaped helper names (``getFoo``, ``testFooBar``) flagged,
#      which is the check the project actually wants from N802.
[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "test_*",
    # fontTools glyph-set / glyph protocol implemented by test doubles
    "getGlyphOrder", "getGlyphName", "getDebugName", "isComposite",
    "getCoordinates", "getBestCmap",
    # fontTools TTFont / table attributes
    "recalcTimestamp", "recalcBBoxes", "unitsPerEm", "numGlyphs",
    "numberOfContours", "advanceHeightMax", "yMin", "yMax",
    "platformID", "platEncID", "nameID", "langID",
    # fontTools CFF top-dict / private-dict attributes
    "rawDict", "fontNames", "nominalWidthX", "defaultWidthX",
    # xml.dom Node attributes
    "localName", "namespaceURI", "nodeName",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
