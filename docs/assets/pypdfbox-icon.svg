<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">pypdfbox icon concept 3 simplified</title>
  <desc id="desc">Simplified trademark-safe stacked document icon with three red lines on the front document.</desc>

