  <path d="M90 152h172l82 82v210c0 20-16 36-36 36H90c-20 0-36-16-36-36V188c0-20 16-36 36-36z" fill="#FFFFFF" stroke="#1565C0" stroke-width="18" stroke-linejoin="round"/>
  <path d="M262 152v54c0 15 13 28 28 28h54z" fill="#1565C0"/>

